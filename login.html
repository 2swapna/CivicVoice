<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CivicVoice</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Header -->

    <header>

        <h1>CivicVoice</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="report.html">Report Problem</a>

            <a href="problems.html">Community Feed</a>

            <a href="about.html">About</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>

        <section>

            <h2>Login</h2>

            <p>
                Login to your CivicVoice account.
            </p>


            <form id="loginForm">


                <!-- Username / Phone / Email -->

                <div>

                    <label for="loginInput">
                        Username / Phone / Email:
                    </label>

                    <input type="text" id="loginInput" placeholder="Enter username, phone or email" required>

                </div>


                <!-- Password -->

                <div>

                    <label for="loginPassword">
                        Password:
                    </label>

                    <input type="password" id="loginPassword" placeholder="Enter password" required>

                </div>


                <!-- Message -->

                <p id="loginMessage"></p>


                <!-- Login Button -->

                <div>

                    <button type="submit">
                        Login
                    </button>

                </div>


            </form>


            <p>

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 CivicVoice. All rights reserved.
        </p>

    </footer>


    <script src="js/login.js"></script>

</body>

</html>
