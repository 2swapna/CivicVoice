<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - CivicVoice</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Header -->

    <header>

        <h1>CivicVoice</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="report.html">Report Problem</a>

            <a href="problems.html">Community Feed</a>

            <a href="about.html">About</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>

        <section>

            <h2>Create Account</h2>

            <p>
                Create your CivicVoice account to report and support community problems.
            </p>


            <form id="registerForm">


                <!-- Name -->

                <div>

                    <label for="name">
                        Full Name:
                    </label>

                    <input type="text" id="name" placeholder="Enter your name" required>

                </div>


                <!-- Username -->

                <div>

                    <label for="username">
                        Username:
                    </label>

                    <input type="text" id="username" placeholder="Create a username" required>

                    <small>
                        Example: swapna_c
                    </small>

                </div>


                <!-- Phone -->

                <div>

                    <label for="phone">
                        Phone Number:
                    </label>

                    <input type="tel" id="phone" placeholder="Enter phone number">

                </div>


                <!-- Email -->

                <div>

                    <label for="email">
                        Email:
                    </label>

                    <input type="email" id="email" placeholder="Enter email">

                </div>


                <!-- Password -->

                <div>

                    <label for="password">
                        Password:
                    </label>

                    <input type="password" id="password" placeholder="Create password" required>

                </div>


                <!-- Confirm Password -->

                <div>

                    <label for="confirmPassword">
                        Confirm Password:
                    </label>

                    <input type="password" id="confirmPassword" placeholder="Confirm password" required>

                </div>


                <!-- Message -->

                <p id="message"></p>


                <!-- Create Account -->

                <div>

                    <button type="submit">

                        Create Account

                    </button>

                </div>


            </form>


            <p>

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 CivicVoice. All rights reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
